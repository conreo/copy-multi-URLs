name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# ── Least privilege ──────────────────────────────────────────
permissions:
  contents: read
  actions: read
  security-events: write  # needed for CodeQL upload

jobs:

  # ── Lint & audit ───────────────────────────────────────────
  lint:
    name: Lint & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: npm audit (production)
        run: npm audit --production || true

      - name: npm audit (all)
        run: npm audit --audit-level=critical

      - name: web-ext lint (AMO compliance)
        run: npx web-ext lint --ignore-files='tests/**' 'node_modules/**' 'vitest.config.js' 'package.json' 'package-lock.json'

      - name: Validate manifest JSON
        run: python3 -m json.tool manifest.json > /dev/null

      - name: Verify required files
        run: |
          for f in manifest.json background.js content.js \
                   icons/icon-32.png icons/icon-48.png icons/icon-64.png \
                   icons/icon-96.png icons/icon-128.png; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "All required files present"

      # ── Security: manifest audit ──────────────────────────
      - name: Manifest security audit
        run: |
          echo "=== Checking for dangerous patterns ==="
          MANIFEST=$(cat manifest.json)

          # No remote scripts
          if echo "$MANIFEST" | grep -qE '"content_security_policy".*"script-src.*https?://'; then
            echo "FAIL: remote script source in CSP"
            exit 1
          fi

          # Data collection declared
          if ! echo "$MANIFEST" | grep -q 'data_collection_permissions'; then
            echo "WARN: no data_collection_permissions declared"
          fi

          # No eval
          if echo "$MANIFEST" | grep -qE '"content_security_policy".*unsafe-eval'; then
            echo "WARN: unsafe-eval in CSP"
          fi

          echo "Manifest security audit passed"

      # ── Security: scan background & content scripts ────────
      - name: Script security scan
        run: |
          echo "=== Checking for eval / innerHTML / remote fetches ==="
          for f in background.js content.js; do
            echo "--- $f ---"
            if grep -n 'eval(' "$f"; then
              echo "WARN: eval() found in $f"
            fi
            if grep -n 'innerHTML' "$f"; then
              echo "WARN: innerHTML found in $f"
            fi
          done
          echo "Script security scan complete"

  # ── CodeQL analysis ────────────────────────────────────────
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - uses: github/codeql-action/analyze@v4

  # ── Release ────────────────────────────────────────────────
  release:
    name: Build & release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release
      id-token: write   # optional: provenance
    steps:
      - uses: actions/checkout@v6

      - name: Package extension (.xpi)
        run: |
          zip -r copy-multi-urls.xpi \
            manifest.json background.js content.js \
            src/ icons/ LICENSE README.md \
            -x "*.git*" ".github/*" "docs/*" "tests/*" "node_modules/*"

      - name: Verify release xpi
        run: |
          echo "XPI contents:"
          unzip -l copy-multi-urls.xpi
          echo ""
          for f in manifest.json background.js src/url-extractor.js content.js; do
            unzip -p copy-multi-urls.xpi "$f" > /dev/null || { echo "MISSING: $f"; exit 1; }
          done
          echo "All key files present"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: copy-multi-urls.xpi
          generate_release_notes: true
